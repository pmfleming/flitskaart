<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img">
  <title>Flitskaart</title>
  <!-- A windmill whose four sails are cards in the four score colours:
       Weet ik niet, Moeilijk, Gaat goed, Makkelijk. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232c45"/>
      <stop offset="1" stop-color="#121726"/>
    </linearGradient>
    <clipPath id="tile"><rect width="128" height="128" rx="28"/></clipPath>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#sky)"/>
  <rect y="108" width="128" height="20" fill="#1a2238" clip-path="url(#tile)"/>
  <!-- The mill: body, cap, door, lit window. -->
  <path d="M53 56 H75 L83 110 H45 Z" fill="#3b4870"/>
  <path d="M51 58 L64 46 L77 58 Z" fill="#4a5a88"/>
  <path d="M58 110 V100 a6 6 0 0 1 12 0 V110 Z" fill="#121726"/>
  <rect x="61" y="72" width="6" height="8" rx="2" fill="#e8c25a" opacity=".85"/>
  <!-- The sails. -->
  <g transform="rotate(45 64 50)"><rect x="55" y="8" width="18" height="38" rx="4" fill="#e8736b"/></g>
  <g transform="rotate(135 64 50)"><rect x="55" y="8" width="18" height="38" rx="4" fill="#e8c25a"/></g>
  <g transform="rotate(225 64 50)"><rect x="55" y="8" width="18" height="38" rx="4" fill="#7b9cf5"/></g>
  <g transform="rotate(315 64 50)"><rect x="55" y="8" width="18" height="38" rx="4" fill="#5fcf86"/></g>
  <circle cx="64" cy="50" r="6.5" fill="#eef1f8"/>
</svg>
